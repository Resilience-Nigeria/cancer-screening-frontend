<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15803d">
<title>NCSR is offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f7f4; color: #16211a; padding: 24px; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #56665b; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; background: #15803d; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>This page isn't available offline yet</h1>
  <p>Open it once while you have a connection, or tap "Make available offline" inside the app, and it will work without internet next time.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
